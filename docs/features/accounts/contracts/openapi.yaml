# Derived by `/sdd:api accounts` — NOT hand-written. Sources:
#   fields + constraints  ← data-model.md (identity.accounts) + spec.md AC-02 (input rules)
#   error responses       ← sad.md §6 sequence alt-branches + §8 crosscutting (error codes, auth, CSRF)
#   endpoint list + shape ← spec.md §4 US-01..US-06 / §5 AC-01..AC-15
# Deviations from the api-skill defaults (recorded in api-sync-report.md):
#   - auth: cookie session (CLAUDE.md · Auth, accounts ADR-0002), not BearerAuth;
#   - error body: RFC 9457 ProblemDetails + `errorCode` (CLAUDE.md · Errors, SAD §8), not {code,message,details?};
#   - every unsafe request carries `X-Rochambeau-Client` (accounts ADR-0005).
openapi: 3.1.0

info:
  title: Rochambeau Accounts API
  version: 0.1.0
  description: |
    Accounts gives Rochambeau identity. A Visitor registers with a unique Username, an email
    address and a password and is logged in right away as a Player. A Player logs in with email
    and password, stays logged in until logging out or going idle (7 days), sees their own Profile
    (including their private email) and opens another Player's public Profile by exact Username.
    The administrator role is shown on the Profile but can only be granted by the portal's
    operator on the host — no operation here accepts or changes a role (AC-13, AC-14).

    Session: an encrypted, `HttpOnly`, `Secure`, `SameSite=Strict` cookie with a 7-day sliding
    lifetime. Every authenticated request re-checks the Account's security stamp and renews the
    cookie, so a role change ends the session on every device (AC-08, AC-13b; accounts ADR-0002).
    Unauthenticated calls get `401` — never a redirect.

    Errors are RFC 9457 ProblemDetails (`application/problem+json`) with an `errorCode`
    extension in the `module.error_name` form. Request bodies bind only the documented
    fields; any other field (for example `role`) is ignored, never rejected and never applied (AC-14).

servers:
  - url: http://localhost:5168
    description: Local (single instance; no hosting chosen yet — spec §8)

# Deny-by-default (SAD §8): every operation needs the session cookie unless it declares `security: []`.
security:
  - CookieSession: []

tags:
  - name: Accounts
    description: Registration (US-01)
  - name: Session
    description: Log in / log out of this browser (US-02, US-03)
  - name: Profiles
    description: Own and public Profiles (US-04, US-05, US-06)

paths:
  /api/v1/accounts:
    post:
      tags: [Accounts]
      summary: Register a new Account and log in as its Player
      description: |
        US-01 · AC-01, AC-02, AC-03, AC-03b, AC-14, AC-15. Username and email are trimmed before
        validation. The Account is always created with role `player`, whatever the body holds.
        On success the response sets the session cookie, so the Visitor is logged in straight away.
        Uniqueness (username ignoring case, email ignoring case) is enforced by the database; of two
        racing registrations exactly one gets `201`, the other `409` (AC-03b).
      operationId: registerAccount
      # unresolved: behaviour when the browser is already logged in (no AC, no §6 branch) —
      # current default: the new session replaces the old one in this browser. OQ-1 in api-sync-report.md.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Registration" }
            example:
              username: "Rocky"
              email: "user-1@example.test"
              password: "test-password-8"
      responses:
        "201":
          description: Account created; this browser is now logged in as its Player.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookieSet" }
            Location:
              description: The own-Profile resource.
              schema: { type: string, const: /api/v1/me }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnProfile" }
              example:
                username: "Rocky"
                email: "user-1@example.test"
                joinedAt: "2026-11-14T10:00:00Z"
                role: player
        "400":
          description: |
            A field breaks a rule (AC-02) — `identity.validation_failed`, with `errors` keyed by field;
            or the client header is missing (accounts ADR-0005) — `common.client_header_required`;
            or the body cannot be read (malformed JSON, empty, wrong type, a Content-Type that is not JSON) —
            `common.invalid_request`.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationProblemDetails"
                  - $ref: "#/components/schemas/ProblemDetails"
              examples:
                validation_failed:
                  value:
                    type: "https://tools.ietf.org/html/rfc9110#section-15.5.1"
                    title: "One or more fields are invalid."
                    status: 400
                    errorCode: identity.validation_failed
                    errors:
                      username: ["The username must be 3 to 20 characters: Latin letters, digits, underscore or hyphen."]
                      password: ["The password must be at least 8 characters."]
                client_header_required:
                  $ref: "#/components/examples/ClientHeaderRequired"
        "409":
          description: |
            The username is already taken (letter case ignored) — `identity.username_taken`; or the
            email address is already used by an Account — `identity.email_unavailable`. Neither names
            the holder (AC-03). Also the losing side of a concurrent registration (AC-03b).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
              examples:
                username_taken:
                  value:
                    type: "https://tools.ietf.org/html/rfc9110#section-15.5.10"
                    title: "This username is already taken."
                    status: 409
                    errorCode: identity.username_taken
                email_unavailable:
                  value:
                    type: "https://tools.ietf.org/html/rfc9110#section-15.5.10"
                    title: "This email address cannot be used."
                    status: 409
                    errorCode: identity.email_unavailable
        "429":
          description: |
            5 Accounts were already registered from this network address within the last 60 minutes
            (AC-15) — `identity.registration_cap`. Failed attempts do not count.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
              example:
                type: "https://tools.ietf.org/html/rfc6585#section-4"
                title: "Too many accounts were created from your connection recently. Try again later."
                status: 429
                errorCode: identity.registration_cap

  /api/v1/session:
    post:
      tags: [Session]
      summary: Log in this browser with email and password
      description: |
        US-02, US-06 · AC-04, AC-05, AC-06, AC-13. The email is trimmed and compared ignoring letter
        case. An unknown email and a wrong password get the same `401` (AC-05). After 5 failed attempts
        in a row the Account is locked for 15 minutes; the 5th failure itself already answers `423`.
        Attempts during the lock neither count nor extend it (AC-06). A malformed email is answered
        like an unknown one (`401`), so the form reveals nothing; only a missing/empty field is a `400`.
        On success the session cookie carries the Account's current role (AC-13).
      operationId: logIn
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
            example:
              email: "user-1@example.test"
              password: "test-password-8"
      responses:
        "200":
          description: Logged in; this browser now holds a session for the Account.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookieSet" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnProfile" }
              example:
                username: "Rocky"
                email: "user-1@example.test"
                joinedAt: "2026-11-14T10:00:00Z"
                role: administrator
        "400":
          description: |
            Email or password missing/empty — `identity.validation_failed`; or the client header is
            missing — `common.client_header_required`; or the body cannot be read —
            `common.invalid_request` (malformed JSON, empty, wrong type, a Content-Type that is not JSON).
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationProblemDetails"
                  - $ref: "#/components/schemas/ProblemDetails"
              examples:
                validation_failed:
                  value:
                    type: "https://tools.ietf.org/html/rfc9110#section-15.5.1"
                    title: "One or more fields are invalid."
                    status: 400
                    errorCode: identity.validation_failed
                    errors:
                      password: ["The password is required."]
                client_header_required:
                  $ref: "#/components/examples/ClientHeaderRequired"
        "401":
          description: |
            No Account holds this email, or the password is wrong (fewer than 5 failures in a row) —
            `identity.invalid_credentials`. Same body in both cases (AC-05).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
              example:
                type: "https://tools.ietf.org/html/rfc9110#section-15.5.2"
                title: "Email or password is incorrect."
                status: 401
                errorCode: identity.invalid_credentials
        "423":
          description: |
            Login is temporarily blocked — `identity.locked_out` — either because this attempt was the
            5th failure in a row, or because the 15-minute block has not ended yet (AC-06). The body
            and `Retry-After` say when to try again.
          headers:
            Retry-After:
              description: Seconds until the block ends.
              schema: { type: integer, minimum: 0 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LockoutProblemDetails" }
              example:
                type: "https://tools.ietf.org/html/rfc4918#section-11.3"
                title: "Login is temporarily blocked. Try again after the time shown."
                status: 423
                errorCode: identity.locked_out
                lockoutEnd: "2026-11-14T10:15:00Z"

    delete:
      tags: [Session]
      summary: Log out this browser
      description: |
        US-03 · AC-07. Ends the session held by this browser only, by clearing its cookie. Other
        devices of the same Account stay logged in; the security stamp is not rotated.
      operationId: logOut
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204":
          description: Logged out; the session cookie is removed from this browser.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookieCleared" }
        "400":
          description: The client header is missing — `common.client_header_required`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
              examples:
                client_header_required:
                  $ref: "#/components/examples/ClientHeaderRequired"
        "401":
          $ref: "#/components/responses/NotAuthenticated"

  /api/v1/me:
    get:
      tags: [Profiles]
      summary: Read my own Profile
      description: |
        US-04, US-06 · AC-08, AC-09, AC-10, AC-13. The only response that carries an email address,
        and only the caller's own. Also the SPA's «who am I» query: `401` means the browser is a
        Visitor (no session, logged out, idle for 7 days, or revoked by a role change — AC-08, AC-13b).
      operationId: getOwnProfile
      responses:
        "200":
          description: The caller's own Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnProfile" }
              example:
                username: "Rocky"
                email: "user-1@example.test"
                joinedAt: "2026-11-14T10:00:00Z"
                role: player
        "401":
          $ref: "#/components/responses/NotAuthenticated"

  /api/v1/profiles/{username}:
    get:
      tags: [Profiles]
      summary: Read another Player's public Profile by exact Username
      description: |
        US-05 · AC-10, AC-11, AC-12. Exact match after trimming, letter case ignored; no partial
        matches. The response type has no email field at all (AC-11). Any value that no Account
        holds — including one that could never be a valid Username — is `404`.
      operationId: getPublicProfile
      parameters:
        - in: path
          name: username
          required: true
          description: The Username to look up, any letter case (e.g. `scissors` finds `Scissors`).
          schema: { type: string, minLength: 1 }
          example: scissors
      responses:
        "200":
          description: The public Profile, with the Username as its owner typed it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
              example:
                username: "Scissors"
                joinedAt: "2026-11-14T09:30:00Z"
                role: player
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "404":
          description: No Account holds this Username — `identity.player_not_found` (AC-12).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
              example:
                type: "https://tools.ietf.org/html/rfc9110#section-15.5.5"
                title: "No player with that username exists."
                status: 404
                errorCode: identity.player_not_found

components:
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      # ASP.NET Core Identity application-cookie default name (accounts ADR-0001 keeps Identity defaults).
      name: .AspNetCore.Identity.Application
      description: |
        Encrypted session cookie set by `registerAccount` / `logIn`: `HttpOnly`, `Secure`,
        `SameSite=Strict`, 7-day sliding lifetime, renewed on every authenticated request; the
        security stamp is validated on every request (accounts ADR-0002). Same-origin only — no CORS.

  parameters:
    ClientHeader:
      in: header
      name: X-Rochambeau-Client
      required: true
      description: |
        CSRF barrier (accounts ADR-0005): required on every unsafe request under `/api`. Its absence is
        rejected before any handler runs with `400 common.client_header_required`. The value is not
        interpreted; the web client sends `web`.
      schema: { type: string, minLength: 1 }
      example: web

  headers:
    SessionCookieSet:
      description: Sets the `CookieSession` cookie for this browser.
      schema: { type: string }
      example: ".AspNetCore.Identity.Application=<opaque>; path=/; secure; samesite=strict; httponly"
    SessionCookieCleared:
      description: Expires the `CookieSession` cookie in this browser.
      schema: { type: string }
      example: ".AspNetCore.Identity.Application=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; secure; samesite=strict; httponly"

  responses:
    NotAuthenticated:
      description: |
        Nobody is logged in on this browser — no session, logged out, idle for 7 days, or the
        session was revoked by a role change (AC-08, AC-10, AC-13b) — `identity.not_authenticated`.
        No profile details are returned; a stale cookie is cleared.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
          example:
            type: "https://tools.ietf.org/html/rfc9110#section-15.5.2"
            title: "Log in or register first."
            status: 401
            errorCode: identity.not_authenticated
    Forbidden:
      description: |
        The logged-in Player's role does not allow this operation — `identity.forbidden`. No operation
        in this contract is role-gated yet; the response is reserved for later steps (Admin) and is what
        the session cookie answers instead of an access-denied redirect (accounts ADR-0002).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
          example:
            type: "https://tools.ietf.org/html/rfc9110#section-15.5.4"
            title: "You are not allowed to do this."
            status: 403
            errorCode: identity.forbidden

  examples:
    ClientHeaderRequired:
      value:
        type: "https://tools.ietf.org/html/rfc9110#section-15.5.1"
        title: "The X-Rochambeau-Client header is required."
        status: 400
        errorCode: common.client_header_required

  schemas:
    # ---- Errors: RFC 9457 ProblemDetails + errorCode (CLAUDE.md · Errors, SAD §8) ----
    ProblemDetails:
      type: object
      required: [type, title, status, errorCode]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, description: Human-readable message shown to the user. }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errorCode:
          type: string
          pattern: "^[a-z_]+\\.[a-z_]+$"
          description: Stable machine code, `module.error_name`.
          enum:
            - common.client_header_required
            - common.invalid_request
            - identity.validation_failed
            - identity.username_taken
            - identity.email_unavailable
            - identity.registration_cap
            - identity.invalid_credentials
            - identity.locked_out
            - identity.not_authenticated
            - identity.player_not_found
            - identity.forbidden

    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              description: |
                One entry per offending field, keyed by the request field name (`username`, `email`,
                `password`), each a list of what the field must be (AC-02).
              additionalProperties:
                type: array
                items: { type: string }

    LockoutProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [lockoutEnd]
          properties:
            lockoutEnd:
              type: string
              format: date-time
              description: UTC moment the block ends; a correct login succeeds from then on (AC-06).

    # ---- Domain value types (data-model.md · identity.accounts) ----
    Username:
      type: string
      description: |
        Public name of a Player, as the owner typed it (after trimming). 3–20 Latin letters a–z/A–Z,
        digits, `_` or `-`. Unique ignoring letter case (AC-02, AC-03).
      minLength: 3
      maxLength: 20
      pattern: "^[A-Za-z0-9_-]{3,20}$"

    Email:
      type: string
      format: email
      description: Email address; unique ignoring letter case (AC-03). Shown only to its owner.
      maxLength: 254  # RFC 5321 path limit; stricter than column varchar(256) — api-sync-report.md F-3

    AccountRole:
      type: string
      enum: [player, administrator]
      description: The Account's single role (accounts ADR-0003). Read-only through this API (AC-14).

    JoinDate:
      type: string
      format: date-time
      description: When the Account was registered, UTC (AC-09, AC-11).

    # ---- Requests (unknown fields are ignored, not rejected — AC-14, SAD §6 self-escalation flow) ----
    Registration:
      type: object
      required: [username, email, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 128
          description: Length is the only rule — no required digits, capitals or symbols (AC-02).

    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          description: Any non-empty text; a malformed or unknown email is answered as `invalid_credentials`.
        password:
          type: string
          writeOnly: true
          minLength: 1

    # ---- Responses (closed shapes: nothing beyond what each AC allows leaves the service) ----
    OwnProfile:
      type: object
      required: [username, email, joinedAt, role]
      additionalProperties: false
      description: The caller's own Profile (AC-09).
      properties:
        username: { $ref: "#/components/schemas/Username" }
        email: { $ref: "#/components/schemas/Email" }
        joinedAt: { $ref: "#/components/schemas/JoinDate" }
        role: { $ref: "#/components/schemas/AccountRole" }

    PublicProfile:
      type: object
      required: [username, joinedAt, role]
      additionalProperties: false
      description: Another Player's Profile — never an email (AC-11).
      properties:
        username: { $ref: "#/components/schemas/Username" }
        joinedAt: { $ref: "#/components/schemas/JoinDate" }
        role: { $ref: "#/components/schemas/AccountRole" }
