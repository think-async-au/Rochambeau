services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rochambeau
      POSTGRES_USER: rochambeau
      POSTGRES_PASSWORD: rochambeau
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rochambeau -d rochambeau"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
